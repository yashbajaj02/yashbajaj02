name: GitHub Metrics

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.isocalendar.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yashbajaj02
          base: ""
          output_action: none
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Generate language statistics
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.languages.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yashbajaj02
          base: ""
          output_action: none
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_threshold: 2
          plugin_languages_details: bytes-size, percentage
          plugin_languages_sections: most-used

      - name: Generate achievements
        uses: lowlighter/metrics@latest
        with:
          filename: assets/metrics.achievements.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          user: yashbajaj02
          base: ""
          output_action: none
          plugin_achievements: yes
          plugin_achievements_display: compact

      - name: Commit generated metrics
        run: |
          sudo cp -r /metrics_renders/. ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --cached --quiet || git commit -m "chore: update GitHub metrics [Skip GitHub Action]"
          git push
